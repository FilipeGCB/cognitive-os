name: v1.5-conformance

on:
  workflow_dispatch:
    inputs:
      sut_model:
        description: "Ollama SUT model"
        required: false
        default: "qwen3:4b"
      grader_model:
        description: "Optional independent grader model"
        required: false
        default: ""
      profile:
        description: "Selection profile; final runs all 58 cases"
        required: false
        type: choice
        options:
          - dev
          - final
        default: dev
  push:
    branches:
      - feat/**
    paths:
      - 'skills/**'
      - 'evals/**'
      - '.github/workflows/conformance.yml'

permissions:
  contents: read

jobs:
  local-model-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start pinned Ollama
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:0.33.2
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs ollama
          exit 1

      - name: Pull conformance SUT model
        env:
          SUT_MODEL: ${{ inputs.sut_model || 'qwen3:4b' }}
        run: docker exec ollama ollama pull "$SUT_MODEL"

      - name: Pull independent grader model when configured
        if: ${{ inputs.grader_model != '' }}
        env:
          GRADER_MODEL: ${{ inputs.grader_model }}
        run: docker exec ollama ollama pull "$GRADER_MODEL"

      - name: Run deterministic contracts and regression suite
        run: python -m unittest discover -s tests -v

      - name: Run V1.5 behavioral conformance
        env:
          SUT_MODEL: ${{ inputs.sut_model || 'qwen3:4b' }}
          GRADER_MODEL: ${{ inputs.grader_model }}
          CONFORMANCE_PROFILE: ${{ inputs.profile || 'dev' }}
          COGNITIVE_OS_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          args=(--suite v1.5 --profile "$CONFORMANCE_PROFILE" --model "$SUT_MODEL" --workers 1 --out evals/runs/v1.5-conformance.json)
          if test -n "$GRADER_MODEL"; then args+=(--grader-model "$GRADER_MODEL"); fi
          python evals/run_local_conformance.py "${args[@]}"

      - name: Publish summary
        if: always()
        run: |
          if test -f evals/runs/v1.5-conformance.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('evals/runs/v1.5-conformance.json')
          d = json.loads(p.read_text())
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('# Cognitive OS V1.5 local conformance\n\n')
              f.write(f"- SUT: `{d['sut_model']}`\n")
              f.write(f"- Grader: separate invocation of `{d['grader_model']}`\n")
              f.write(f"- Result: **{d['overall']}**\n")
              f.write(f"- Score: **{d['pass_count']}/{d['cases']}** (required {d['required_pass_count']})\n")
              f.write(f"- Critical failures: `{d['critical_failures']}`\n")
          PY
          fi

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.5-conformance
          path: evals/runs/v1.5-conformance.json
          if-no-files-found: warn
