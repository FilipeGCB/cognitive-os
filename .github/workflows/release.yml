name: release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write

jobs:
  stable-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly the verified main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create immutable stable tag and GitHub Release when every gate is explicit
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < skills/cognitive-os/VERSION)"
          if [[ "$VERSION" == *-dev* || "$VERSION" == *-rc* || -z "$VERSION" ]]; then
            echo "VERSION=$VERSION is not stable; no release will be created."
            exit 0
          fi

          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to move or recreate a stable release."
            exit 0
          fi

          if [[ "$VERSION" == "1.4.0" ]]; then
            # Preserve the already-published historical release contract. New
            # releases must use the machine-bound evidence path below.
            EVIDENCE="docs/releases/v1.4.0-release-evidence.md"
            test -f "$EVIDENCE"
            grep -Fxq 'RELEASE_GATE: PASS' "$EVIDENCE"
            CANDIDATE_SHA="$EVIDENCE_COMMIT"
          else
            EVIDENCE="docs/releases/v${VERSION}-release-evidence.json"
            test -f "$EVIDENCE"
            # Behavioral reports are generated after the tested candidate is
            # known. The evidence commit may therefore be a documentation-only
            # descendant that points back to the exact candidate SHA.
            CANDIDATE_SHA="$(python3 - "$EVIDENCE" <<'PY'
          import json
          import sys
          from pathlib import Path

          record = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(record["candidate_sha"])
          PY
            )"
            git merge-base --is-ancestor "$CANDIDATE_SHA" "$EVIDENCE_COMMIT"
            python3 tools/validate_release_evidence.py "$EVIDENCE" --candidate-sha "$CANDIDATE_SHA" --require-behavioral-pass
          fi

          test "$(git rev-parse HEAD)" = "$EVIDENCE_COMMIT"
          test "$(git rev-parse "$CANDIDATE_SHA")" = "$CANDIDATE_SHA"
          gh release create "$TAG" \
            --target "$CANDIDATE_SHA" \
            --title "Cognitive OS ${TAG}" \
            --generate-notes
