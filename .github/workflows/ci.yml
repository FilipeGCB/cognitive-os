name: ci

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate eval manifests
        run: |
          python evals/validate_cases.py evals/v1.4-core-cases.json
          python evals/validate_cases.py evals/v1.4-output-cases.json

      - name: Validate public package
        run: python tools/validate_public_package.py

      - name: Validate V1.5 version synchronization
        run: python tools/validate_version_sync.py

      - name: Validate machine contracts
        run: python tools/validate_machine_contracts.py --check-schemas

      - name: Public PII scan
        run: python tools/scan_public_pii.py

      - name: Renderer smoke test
        run: |
          python renderers/decision-brief/render.py \
            examples/decision-brief-simple.md \
            /tmp/decision-brief.html
          test -s /tmp/decision-brief.html

      - name: Python compile check
        run: python -m compileall -q bootstrap evals renderers tests tools

  install-smoke:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify skill discovery
        run: npx -y skills@latest add ./skills --list

      - name: Install for Codex
        run: |
          npx -y skills@latest add ./skills --skill cognitive-os --agent codex -y --copy
          test -f .agents/skills/cognitive-os/SKILL.md

      - name: Install for Claude Code
        run: |
          npx -y skills@latest add ./skills --skill cognitive-os --agent claude-code -y --copy
          test -f .claude/skills/cognitive-os/SKILL.md

      - name: Install for Gemini CLI
        run: |
          npx -y skills@latest add ./skills --skill cognitive-os --agent gemini-cli -y --copy
          test -f .agents/skills/cognitive-os/SKILL.md

  notebooklm-adapter-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned NotebookLM MCP candidate
        run: python -m pip install "notebooklm-py[mcp]==0.8.2"

      - name: Verify NotebookLM CLI and MCP entrypoints
        run: |
          notebooklm --version
          notebooklm-mcp --help >/dev/null

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
