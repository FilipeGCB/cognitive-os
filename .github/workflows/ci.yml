name: ci

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate skill references
        run: python tools/validate_skill_references.py

      - name: Validate eval manifests
        run: |
          python evals/validate_cases.py evals/v1.4-core-cases.json
          python evals/validate_cases.py evals/v1.4-output-cases.json
          python evals/validate_cases.py evals/v1.5-cases.json --family-v1-5
          python evals/validate_cases.py evals/v1.5-output-cases.json --family-v1-5
          python evals/validate_cases.py evals/v1.5-distribution-cases.json --family-v1-5

      - name: Validate public package
        run: python tools/validate_public_package.py

      - name: Validate V1.5 version synchronization
        run: python tools/validate_version_sync.py

      - name: Validate machine contracts
        run: python tools/validate_machine_contracts.py --check-schemas

      - name: Validate historical release evidence structure
        run: python tools/validate_release_evidence.py docs/releases/v1.5.0-dev-release-evidence.json --historical

      - name: Validate distribution declarations
        run: python tools/validate_distribution.py

      - name: Validate public telemetry Gate T controls
        run: python tools/validate_gate_t.py

      - name: Public PII scan
        run: python tools/scan_public_pii.py

      - name: Renderer smoke test
        run: |
          python renderers/decision-brief/render.py \
            examples/decision-brief-simple.md \
            /tmp/decision-brief.html
          test -s /tmp/decision-brief.html

      - name: Python compile check
        run: python -m compileall -q bootstrap evals renderers telemetry tests tools skills/cognitive-os/scripts

  install-smoke:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify skill discovery
        run: npx -y skills@1.5.23 add ./skills --list

      - name: Validate canonical package declaration
        run: python tools/validate_distribution.py

      - name: Install for Codex
        run: |
          npx -y skills@1.5.23 add ./skills --skill cognitive-os --agent codex -y --copy
          test -f .agents/skills/cognitive-os/SKILL.md
          test -f .agents/skills/cognitive-os/scripts/find_mcp.py
          python .agents/skills/cognitive-os/scripts/find_mcp.py --self-check | grep '"state": "READY"'

      - name: Install mandatory Find Skills for Codex
        run: |
          npx -y skills@1.5.23 add https://github.com/vercel-labs/skills --skill find-skills --agent codex -y --copy
          test -f .agents/skills/find-skills/SKILL.md

      - name: Install for Claude Code
        run: |
          npx -y skills@1.5.23 add ./skills --skill cognitive-os --agent claude-code -y --copy
          test -f .claude/skills/cognitive-os/SKILL.md
          test -f .claude/skills/cognitive-os/scripts/find_mcp.py
          python .claude/skills/cognitive-os/scripts/find_mcp.py --self-check | grep '"state": "READY"'

      - name: Install mandatory Find Skills for Claude Code
        run: |
          npx -y skills@1.5.23 add https://github.com/vercel-labs/skills --skill find-skills --agent claude-code -y --copy
          test -f .claude/skills/find-skills/SKILL.md

      - name: Install for Gemini CLI
        run: |
          npx -y skills@1.5.23 add ./skills --skill cognitive-os --agent gemini-cli -y --copy
          test -f .agents/skills/cognitive-os/SKILL.md
          test -f .agents/skills/cognitive-os/scripts/find_mcp.py
          python .agents/skills/cognitive-os/scripts/find_mcp.py --self-check | grep '"state": "READY"'

      - name: Install mandatory Find Skills for Gemini CLI
        run: |
          npx -y skills@1.5.23 add https://github.com/vercel-labs/skills --skill find-skills --agent gemini-cli -y --copy
          test -f .agents/skills/find-skills/SKILL.md

      - name: Smoke-test projected distribution artifacts
        run: |
          python tools/project_distribution.py --output-dir "$RUNNER_TEMP/cognitive-os-distributions"
          python tools/validate_distribution.py \
            --artifact agent-skills="$RUNNER_TEMP/cognitive-os-distributions/agent-skills" \
            --artifact openai="$RUNNER_TEMP/cognitive-os-distributions/openai" \
            --artifact claude="$RUNNER_TEMP/cognitive-os-distributions/claude" \
            --artifact gemini="$RUNNER_TEMP/cognitive-os-distributions/gemini"

  notebooklm-adapter-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned NotebookLM MCP candidate
        run: python -m pip install "notebooklm-py[mcp]==0.8.2"

      - name: Verify NotebookLM CLI and MCP entrypoints
        run: |
          notebooklm --version
          notebooklm-mcp --help >/dev/null

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
