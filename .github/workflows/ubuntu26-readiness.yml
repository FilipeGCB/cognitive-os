name: Ubuntu 26 core compatibility (manual + migration PR)

on:
  pull_request:
    paths: ['.github/workflows/ubuntu26-readiness.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'chore/ubuntu26-readiness-20260925'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_public_package.py
      - run: python tools/scan_public_pii.py
      - run: python -m compileall -q bootstrap evals renderers tests tools
